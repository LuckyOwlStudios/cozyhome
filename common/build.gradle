architectury {
	common rootProject.enabled_platforms.split(',')
}

loom {
	accessWidenerPath = file('src/main/resources/cozyhome.accesswidener')
}

sourceSets {
	main {
		resources {
			// Output of the data generators (run them with `./gradlew :neoforge:runData`).
			// Both loaders ship these files.
			srcDir 'src/main/generated'
			exclude '.cache/**'
		}
	}
}

dependencies {
	// We depend on Fabric Loader here only to use the @Environment annotations and mixin dependencies.
	// Do NOT use other classes from Fabric Loader (or Fabric API) in common code.
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

	// Every Compat API, compile only. The integration in compat/everycomp is only loaded when it's installed.
	modCompileOnly("maven.modrinth:every-compat:$rootProject.everycomp_fabric_version") { transitive = false }
	modCompileOnly("maven.modrinth:moonlight:$rootProject.moonlight_fabric_version") { transitive = false }
}
