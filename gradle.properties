# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft
minecraft_version=1.21.1
enabled_platforms=fabric,neoforge

# Mappings (yarn, with Architectury's patch so yarn also works on NeoForge)
yarn_mappings=1.21.1+build.3
yarn_mappings_patch_neoforge_version=1.21+build.4

# Mod Properties
mod_version=1.1.20
maven_group=net.luckystudio.cozyhome
archives_base_name=Luckys-Cozyhome-Refurnished
mod_id=cozyhome

# Fabric
# check these on https://fabricmc.net/develop
fabric_loader_version=0.16.14
fabric_api_version=0.116.15+1.21.1

# NeoForge
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.248

# Moonlight Lib 1.21.1-3.8.3 (Universal Sawmill's library)
moonlight_fabric_version=uANIaPO7
moonlight_neoforge_version=yBea1yLM
# Universal Sawmill 1.21-1.9.0. Optional: Cozyhome ships conditional sawmill recipes, loaded in dev runs only.
# Modrinth version ids (the Modrinth maven needs ids because both loaders share one version number).
sawmill_fabric_version=bwEJmWMF
sawmill_neoforge_version=ZMKDCsBW
