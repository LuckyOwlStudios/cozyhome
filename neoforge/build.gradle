plugins {
	id 'com.github.johnrengelman.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

def commonGeneratedDir = project(':common').file('src/main/generated').absolutePath
def commonResourcesDir = project(':common').file('src/main/resources').absolutePath

loom {
	accessWidenerPath = project(':common').loom.accessWidenerPath

	runs {
		// NeoForge data generation. Writes into common/src/main/generated so both loaders get the output.
		// Run with: ./gradlew :neoforge:runData
		data {
			data()
			name 'Data Generation'
			programArgs '--all', '--mod', 'cozyhome'
			programArgs '--output', commonGeneratedDir
			programArgs '--existing', commonResourcesDir
		}
	}
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	// Files in this configuration will be bundled into the mod jar using the Shadow plugin.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

	// Every Compat: compile against it, and load it in dev runs only (never a dependency of the released jar).
	modCompileOnly("maven.modrinth:every-compat:$rootProject.everycomp_neoforge_version") { transitive = false }
	modCompileOnly("maven.modrinth:moonlight:$rootProject.moonlight_neoforge_version") { transitive = false }
	modLocalRuntime("maven.modrinth:every-compat:$rootProject.everycomp_neoforge_version") { transitive = false }
	modLocalRuntime("maven.modrinth:moonlight:$rootProject.moonlight_neoforge_version") { transitive = false }
	if (rootProject.dev_wood_mods.toBoolean()) {
		modLocalRuntime("maven.modrinth:natures-spirit:$rootProject.natures_spirit_neoforge_version") { transitive = false }
		modLocalRuntime("maven.modrinth:XaDC71GB:$rootProject.lithostitched_neoforge_version") { transitive = false }
	}

	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	// Turns the common access widener into a NeoForge access transformer.
	atAccessWideners.add 'cozyhome.accesswidener'
}

sourcesJar {
	def commonSources = project(':common').sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}
